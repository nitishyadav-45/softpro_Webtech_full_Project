<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Online Attendance System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(180deg, #071224, #041220);
      color: #e6f0fb;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    }
    .card {
      background: red;
      border-radius: 12px;
    }
    .btn-primary {
      background: #1e90ff;
      border: none;
    }
    .navbar {
      background: #0f2940;
    }
    .table thead th {
      color: #e6f0fb;
    }
  </style>
</head>
<body>

<!-- 🔹 Login Page -->
<div id="login-page" class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="col-md-5">
    <div class="card p-4">
      <h3 class="mb-3">Admin / Teacher Login</h3>
      <form onsubmit="event.preventDefault(); showDashboard();">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input id="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input id="password" type="password" class="form-control" required>
        </div>
        <button class="btn btn-primary w-100">Login</button>
      </form>
    </div>
  </div>
</div>

<!-- 🔹 Dashboard -->
<div id="dashboard" class="d-none">
  <nav class="navbar navbar-expand-lg p-3">
    <div class="container">
      <a class="navbar-brand text-white">Attendance System</a>
      <div>
        <button class="btn btn-outline-light me-2" onclick="showAttendance()">Mark Attendance</button>
        <button class="btn btn-outline-light me-2" onclick="showReports()">Reports</button>
        <button class="btn btn-primary" onclick="showLogin()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div id="attendance-page" class="card p-4 d-none">
      <h4>Mark Attendance</h4>
      <div class="table-responsive">
        <table class="table table-dark table-striped">
          <thead>
            <tr><th>Roll</th><th>Name</th><th>Status</th></tr>
          </thead>
          <tbody>
            <tr>
              <td>101</td>
              <td>Amit Kumar</td>
              <td>
                <input type="checkbox" checked> Present
              </td>
            </tr>
            <tr>
              <td>102</td>
              <td>Priya Sharma</td>
              <td>
                <input type="checkbox"> Present
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <button class="btn btn-primary mt-2">Save Attendance</button>
    </div>

    <div id="reports-page" class="card p-4 d-none">
      <h4>Attendance Reports</h4>
      <div class="table-responsive">
        <table class="table table-dark">
          <thead>
            <tr><th>Roll</th><th>Name</th><th>Present/Total</th><th>%</th></tr>
          </thead>
          <tbody>
            <tr><td>101</td><td>Amit Kumar</td><td>5/6</td><td>83%</td></tr>
            <tr><td>102</td><td>Priya Sharma</td><td>4/6</td><td>67%</td></tr>
            <tr><td>102</td><td>Nitish</td><td>5/6</td><td>87%</td></tr>
          </tbody>
        </table>
      </div>
      <button class="btn btn-outline-light">Export to CSV</button>
    </div>
  </div>
</div>

<script>
function showLogin(){
  document.getElementById('login-page').classList.remove('d-none');
  document.getElementById('dashboard').classList.add('d-none');
}
function showDashboard(){
  document.getElementById('login-page').classList.add('d-none');
  document.getElementById('dashboard').classList.remove('d-none');
  showAttendance();
}
function showAttendance(){
  document.getElementById('attendance-page').classList.remove('d-none');
  document.getElementById('reports-page').classList.add('d-none');
}
function showReports(){
  document.getElementById('reports-page').classList.remove('d-none');
  document.getElementById('attendance-page').classList.add('d-none');
}
</script>

</body>
</html>
