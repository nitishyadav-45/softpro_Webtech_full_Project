<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard with Collapsible Sidebar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --primary: #2575fc;
      --secondary: #6a11cb;
    }

    body {
      font-family: "Poppins", sans-serif;
      background-color: #f7f9fc;
      transition: background 0.3s;
    }

    /* Navbar */
    .navbar {
      background: linear-gradient(90deg, var(--secondary), var(--primary));
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: fixed;
      width: 100%;
      z-index: 1000;
    }

    .navbar-brand {
      color: #fff !important;
      font-weight: 600;
      font-size: 1.3rem;
      margin-left: 10px;
    }

    /* 3 Dash Toggle Button */
    .toggle-btn {
      border: none;
      background: none;
      color: white;
      font-size: 1.8rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .toggle-btn:hover {
      transform: scale(1.1);
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 240px;
      background: var(--primary);
      color: white;
      padding-top: 80px;
      transition: all 0.3s ease;
      overflow: hidden;
      z-index: 999;
    }

    .sidebar.collapsed {
      width: 70px;
    }

    .sidebar .logo-text {
      font-size: 1.2rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 20px;
      transition: opacity 0.3s;
    }

    .sidebar.collapsed .logo-text {
      opacity: 0;
    }

    .sidebar a {
      display: flex;
      align-items: center;
      color: white;
      text-decoration: none;
      padding: 12px 20px;
      margin: 6px 10px;
      border-radius: 10px;
      transition: 0.3s;
      white-space: nowrap;
    }

    .sidebar a i {
      font-size: 1.3rem;
      margin-right: 15px;
      min-width: 25px;
      text-align: center;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background: var(--secondary);
    }

    /* Hide text when collapsed */
    .sidebar.collapsed a span {
      display: none;
    }

    /* Content */
    .content {
      margin-left: 240px;
      padding: 30px;
      transition: margin-left 0.3s;
    }

    .content.full {
      margin-left: 70px;
    }

    /* Cards */
    .card {
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      border: none;
      transition: transform 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card-header {
      background: linear-gradient(90deg, var(--secondary), var(--primary));
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
    }

    /* Profile Image */
    .profile-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #fff;
      margin: 0 auto 10px;
      display: block;
      transition: all 0.3s;
    }

    .sidebar.collapsed .profile-img {
      width: 45px;
      height: 45px;
    }

    .profile-name {
      text-align: center;
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 20px;
      transition: opacity 0.3s;
    }

    .sidebar.collapsed .profile-name {
      opacity: 0;
    }

    @media (max-width: 992px) {
      .sidebar {
        left: -240px;
      }

      .sidebar.show {
        left: 0;
      }

      .content {
        margin-left: 0;
      }

      .content.full {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="d-flex align-items-center">
      <button class="toggle-btn" id="menuToggle">&#9776;</button>
      <a href="#" class="navbar-brand ms-2">Dashboard</a>
    </div>
    <div>
      <a href="#" class="text-white me-3 text-decoration-none">Profile</a>
      <a href="#" class="text-white text-decoration-none">Logout</a>
    </div>
  </nav>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="text-center mb-3">
      <img src="https://via.placeholder.com/100" alt="Profile" class="profile-img">
      <div class="profile-name">Admin User</div>
    </div>
    <a href="#" class="active"><i class="bi bi-speedometer2"></i><span> Dashboard</span></a>
    <a href="#"><i class="bi bi-person"></i><span> Students</span></a>
    <a href="#"><i class="bi bi-cash"></i><span> Fees</span></a>
    <a href="#"><i class="bi bi-bell"></i><span> Reminders</span></a>
    <a href="#"><i class="bi bi-envelope"></i><span> Messages</span></a>
    <a href="#"><i class="bi bi-gear"></i><span> Settings</span></a>
  </div>

  <!-- Main Content -->
  <div class="content" id="mainContent">
    <div class="container-fluid mt-4">
      <div class="row">
        <div class="col-md-4 mb-3">
          <div class="card text-center">
            <div class="card-header">Total Students</div>
            <div class="card-body"><h3>245</h3></div>
          </div>
        </div>
        <div class="col-md-4 mb-3">
          <div class="card text-center">
            <div class="card-header bg-success">Fees Collected</div>
            <div class="card-body"><h3>₹ 1,20,000</h3></div>
          </div>
        </div>
        <div class="col-md-4 mb-3">
          <div class="card text-center">
            <div class="card-header bg-danger">Pending Fees</div>
            <div class="card-body"><h3>₹ 35,000</h3></div>
          </div>
        </div>
      </div>

      <div class="card mt-4">
        <div class="card-header bg-info text-white">Recent Transactions</div>
        <div class="card-body">
          <table class="table table-bordered">
            <thead>
              <tr>
                <th>Student Name</th>
                <th>Amount</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr><td>Rahul Sharma</td><td>₹5000</td><td><span class="badge bg-success">Paid</span></td></tr>
              <tr><td>Priya Verma</td><td>₹3000</td><td><span class="badge bg-danger">Unpaid</span></td></tr>
              <tr><td>Amit Kumar</td><td>₹7000</td><td><span class="badge bg-success">Paid</span></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script>
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const content = document.getElementById('mainContent');

    menuToggle.addEventListener('click', () => {
      if (window.innerWidth <= 992) {
        sidebar.classList.toggle('show');
      } else {
        sidebar.classList.toggle('collapsed');
        content.classList.toggle('full');
      }
    });
  </script>
</body>
</html>
