<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spotify Clone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <h2>Spotify</h2>
      <nav>
        <ul>
          <li>Home</li>
          <li>Search</li>
          <li>Your Library</li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <header>
        <h1>Good Morning</h1>
      </header>

      <section class="playlists">
        <div class="card">
          <img src="https://via.placeholder.com/150" alt="Playlist">
          <p>Top Hits</p>
        </div>
        <div class="card">
          <img src="https://via.placeholder.com/150" alt="Playlist">
          <p>Daily Mix</p>
        </div>
        <div class="card">
          <img src="https://via.placeholder.com/150" alt="Playlist">
          <p>Chill Beats</p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
