<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Holi 2026</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Highly Animated Gradient Background */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #ff0055, #ffcc00, #00ccff, #00ff66, #9900ff);
            background-size: 400% 400%;
            animation: gradientMove 8s ease infinite;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Color Bubbles */
        .bubble {
            position: absolute;
            border-radius: 50%;
            opacity: 0.6;
            animation: floatUp 6s infinite ease-in-out alternate;
            filter: blur(5px);
            z-index: 0;
        }

        .b1 { width: 100px; height: 100px; background: #fff; top: 10%; left: 20%; animation-duration: 5s; }
        .b2 { width: 150px; height: 150px; background: #fff; bottom: 20%; right: 15%; animation-duration: 7s; }
        .b3 { width: 80px; height: 80px; background: #fff; top: 40%; right: 30%; animation-duration: 6s; }

        @keyframes floatUp {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-50px) scale(1.2); }
        }

        /* Main Glass Card */
        .card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 1;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            transform: translateY(0);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: dropIn 1s ease-out forwards;
        }

        .card:hover {
            transform: translateY(-15px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.8);
        }

        @keyframes dropIn {
            0% { opacity: 0; transform: translateY(-100px) scale(0.8); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Typography */
        h1 {
            font-size: 3rem;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .year {
            color: #ffe600;
            font-size: 3.5rem;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); text-shadow: 0 0 20px #ffe600; }
            100% { transform: scale(1); }
        }

        p {
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 25px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
        }

        /* Colorful Icons Container */
        .icon-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .icon-container i {
            font-size: 2.5rem;
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .icon-container i:nth-child(1) { color: #ff0055; }
        .icon-container i:nth-child(2) { color: #00ccff; }
        .icon-container i:nth-child(3) { color: #00ff66; }
        .icon-container i:nth-child(4) { color: #ffcc00; }

        .icon-container i:hover {
            transform: scale(1.3) rotate(360deg);
            background: #fff;
            box-shadow: 0 10px 25px rgba(255,255,255,0.6);
        }

        /* Interactive Button */
        .btn {
            background: #fff;
            color: #ff0055;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-transform: uppercase;
        }

        .btn:hover {
            background: #ffcc00;
            color: #000;
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(255, 204, 0, 0.5);
            letter-spacing: 1px;
        }

        .sender {
            margin-top: 20px;
            font-size: 0.9rem;
            font-weight: 300;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 15px;
        }

    </style>
</head>
<body>

    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>

    <div class="card">
        <h1>Happy Holi <br> <span class="year">2026</span></h1>
        
        <div class="icon-container">
            <i class="fa-solid fa-palette" title="Colors"></i>
            <i class="fa-solid fa-face-smile" title="Joy"></i>
            <i class="fa-solid fa-music" title="Music"></i>
            <i class="fa-solid fa-hand-sparkles" title="Magic"></i>
        </div>

        <p>May your life be as colorful and joyful as the festival of Holi. Wishing you peace, prosperity, and happiness!</p>
        
        <button class="btn" onclick="throwColors()">Click for Magic 🎨</button>

        <p class="sender">Best wishes from <strong>Nitish Kumar Yadav</strong></p>
    </div>

    <script>
        function throwColors() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                
                // Blast from multiple directions with bright Holi colors
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
                    colors: ['#ff0055', '#00ccff', '#00ff66', '#ffcc00', '#9900ff']
                }));
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
                    colors: ['#ff0055', '#00ccff', '#00ff66', '#ffcc00', '#9900ff']
                }));
            }, 250);
        }
    </script>
</body>
</html>
