<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Holi 2026</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;
    background:linear-gradient(45deg,#ff0080,#ff8c00,#40e0d0,#8a2be2);
    background-size:400% 400%;
    animation:gradientBG 12s ease infinite;
    color:white;
}

@keyframes gradientBG{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    padding:40px 20px;
}

.glass{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    padding:40px;
    border-radius:20px;
    box-shadow:0 0 30px rgba(0,0,0,0.3);
    transition:0.4s;
}

.glass:hover{
    transform:scale(1.03);
    box-shadow:0 0 40px rgba(255,255,255,0.6);
}

h1{
    font-size:3rem;
    font-weight:800;
    animation:pop 1.5s infinite alternate;
}

@keyframes pop{
    from{transform:scale(1)}
    to{transform:scale(1.08)}
}

.holi-img{
    width:100%;
    border-radius:15px;
    margin-top:20px;
    transition:0.5s;
}

.holi-img:hover{
    transform:rotate(3deg) scale(1.05);
}

.icon-row i{
    font-size:30px;
    margin:10px;
    transition:0.4s;
}

.icon-row i:hover{
    transform:scale(1.4) rotate(20deg);
}

.countdown{
    font-size:1.5rem;
    margin-top:20px;
    font-weight:600;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:-1;
}

footer{
    background:rgba(0,0,0,0.4);
    padding:15px;
    text-align:center;
}
</style>
</head>
<body>

<canvas id="particles"></canvas>

<section class="hero">
<div class="glass col-lg-8 col-md-10 col-12">
    <h1>🎉 Happy Holi 2026 🎉</h1>
    <p class="lead">May your life be filled with vibrant colors of joy, happiness and success!</p>

    <div class="icon-row">
        <i class="fa-solid fa-droplet text-danger"></i>
        <i class="fa-solid fa-palette text-warning"></i>
        <i class="fa-solid fa-face-smile text-success"></i>
        <i class="fa-solid fa-gift text-info"></i>
        <i class="fa-solid fa-star text-primary"></i>
    </div>

    <img src="images/maxime-bhm-icyZmdkCGZ0-unsplash.jpg"
         alt="Holi Festival"
         class="holi-img"
         onerror="this.onerror=null;this.src='https://source.unsplash.com/800x500/?festival';">

    <div class="countdown mt-3" id="countdown"></div>

</div>
</section>

<footer>
    Made with ❤️ by Nitish | Holi 2026 Celebration
</footer>

<script>
// Countdown
const holiDate = new Date(2026,2,10,0,0,0).getTime();

const timer = setInterval(function(){
    const now = new Date().getTime();
    const distance = holiDate - now;

    const days = Math.floor(distance / (1000*60*60*24));
    const hours = Math.floor((distance % (1000*60*60*24)) / (1000*60*60));
    const minutes = Math.floor((distance % (1000*60*60)) / (1000*60));
    const seconds = Math.floor((distance % (1000*60)) / 1000);

    document.getElementById("countdown").innerHTML =
    "⏳ "+days+"d "+hours+"h "+minutes+"m "+seconds+"s Left";

    if(distance < 0){
        clearInterval(timer);
        document.getElementById("countdown").innerHTML = "🎨 It's Holi Time!";
    }
},1000);

// Particle Effect
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

function createParticle(){
    particles.push({
        x: Math.random()*canvas.width,
        y: 0,
        size: Math.random()*8+2,
        speed: Math.random()*3+1,
        color: `hsl(${Math.random()*360},100%,50%)`
    });
}

function updateParticles(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach((p,i)=>{
        p.y += p.speed;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();

        if(p.y > canvas.height){
            particles.splice(i,1);
        }
    });
}

setInterval(createParticle,200);
function animate(){
    updateParticles();
    requestAnimationFrame(animate);
}
animate();

window.addEventListener("resize",()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
