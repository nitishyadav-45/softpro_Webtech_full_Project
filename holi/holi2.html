<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Holi 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Colorful Animated Background */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, #ff0055, #ffcc00, #00ccff, #00ff66, #ff00cc);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Color Splashes */
        .splash {
            position: absolute;
            border-radius: 50%;
            filter: blur(8px);
            z-index: 0;
            animation: float 6s infinite ease-in-out alternate;
        }
        .splash-1 { width: 150px; height: 150px; background: rgba(255, 0, 85, 0.6); top: 10%; left: 15%; animation-delay: 0s; }
        .splash-2 { width: 200px; height: 200px; background: rgba(0, 204, 255, 0.6); bottom: 15%; right: 10%; animation-delay: 1s; }
        .splash-3 { width: 120px; height: 120px; background: rgba(255, 204, 0, 0.6); top: 20%; right: 20%; animation-delay: 2s; }
        .splash-4 { width: 180px; height: 180px; background: rgba(0, 255, 102, 0.6); bottom: 10%; left: 20%; animation-delay: 3s; }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-40px) scale(1.2); }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            padding: 3rem 2rem;
            text-align: center;
            z-index: 1;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            max-width: 600px;
            width: 90%;
        }

        .glass-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 45px 0 rgba(0, 0, 0, 0.5);
        }

        /* Typography & Animations */
        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.4);
            margin-bottom: 1rem;
            animation: popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .year {
            background: -webkit-linear-gradient(#ffe600, #ff0077);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 4rem;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        p.lead {
            color: #f8f9fa;
            font-weight: 500;
            font-size: 1.25rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            margin-bottom: 2rem;
        }

        /* Image Styling */
        .holi-img {
            max-width: 250px;
            border-radius: 50%;
            border: 5px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            margin-bottom: 2rem;
            transition: all 0.5s ease;
        }

        .holi-img:hover {
            transform: rotate(15deg) scale(1.1);
            border-color: #ffcc00;
        }

        /* Custom Button */
        .btn-holi {
            background: linear-gradient(45deg, #ff0055, #ffcc00);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-holi:hover {
            background: linear-gradient(45deg, #ffcc00, #ff0055);
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(255, 204, 0, 0.6);
            color: white;
        }

        /* Keyframes */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="splash splash-1"></div>
    <div class="splash splash-2"></div>
    <div class="splash splash-3"></div>
    <div class="splash splash-4"></div>

    <div class="container d-flex justify-content-center">
        <div class="glass-card">
            <img src="images/john-thomas-LtE6W_JVTGc-unsplash.jpg" alt="Holi Colors" class="holi-img img-fluid">
            
            <h1>Happy Holi <br><span class="year">2026</span></h1>
            <p class="lead">May the canvas of your life be painted with the most vibrant colors of joy, success, and love!</p>
            
            <button class="btn btn-holi" onclick="triggerConfetti()">Spread the Colors</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.css"></script>
    
    <script>
        function triggerConfetti() {
            const button = document.querySelector('.btn-holi');
            button.innerText = "Wishes Sent! 🎨";
            button.style.background = "linear-gradient(45deg, #00ff66, #00ccff)";
            
            // Add a quick pulse animation to the whole card
            const card = document.querySelector('.glass-card');
            card.style.transform = "scale(1.05)";
            setTimeout(() => {
                card.style.transform = "scale(1)";
            }, 300);
        }
    </script>
</body>
</html>
