<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holi Celebration 2026</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;
    background: linear-gradient(-45deg,#ff0080,#ff8c00,#40e0d0,#ff1493);
    background-size:400% 400%;
    animation:gradientBG 12s ease infinite;
}

@keyframes gradientBG{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.hero{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:#fff;
    padding:20px;
}

.hero h1{
    font-size:3.5rem;
    font-weight:900;
    text-shadow:0 0 20px #fff;
    animation:zoom 3s infinite alternate;
}

@keyframes zoom{
    from{transform:scale(1);}
    to{transform:scale(1.1);}
}

.icon-box i{
    font-size:40px;
    margin:15px;
    transition:0.4s;
}

.icon-box i:hover{
    transform:scale(1.3) rotate(15deg);
}

.btn-holi{
    background:linear-gradient(45deg,#ff00ff,#ff8c00);
    border:none;
    color:#fff;
    padding:12px 30px;
    border-radius:50px;
    transition:0.4s;
    font-weight:bold;
}

.btn-holi:hover{
    transform:scale(1.1);
    box-shadow:0 0 20px #fff;
}

.wish{
    font-size:1.3rem;
    margin-top:15px;
    min-height:40px;
}

/* Color Splash Animation */
.splash{
    position:fixed;
    width:12px;
    height:12px;
    border-radius:50%;
    opacity:0.8;
    animation:fall 3s linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(100vh);
        opacity:0;
    }
}

footer{
    background:#000;
    color:#fff;
    text-align:center;
    padding:10px;
}
</style>
</head>

<body>

<div class="hero container">
<div>

<h1>🎉 Happy Holi 2026 🎨</h1>

<div class="icon-box">
    <i class="fa-solid fa-palette text-warning"></i>
    <i class="fa-solid fa-face-smile text-danger"></i>
    <i class="fa-solid fa-heart text-success"></i>
    <i class="fa-solid fa-star text-info"></i>
</div>

<input type="text" id="name" class="form-control mt-4" placeholder="Enter Your Name">

<button class="btn btn-holi mt-3" onclick="wishMe()">
<i class="fa-solid fa-gift"></i> Generate Wish
</button>

<div class="wish text-white" id="wishText"></div>

<button class="btn btn-success mt-3" onclick="shareWhatsApp()">
<i class="fa-brands fa-whatsapp"></i> Share on WhatsApp
</button>

</div>
</div>

<footer>
Made with ❤️ | Holi Festival 2026
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Personalized Wish
function wishMe(){
    let name = document.getElementById("name").value;
    let message = "Wishing you a colorful Holi 2026!";
    if(name.trim()!=""){
        message="🎨 Happy Holi 2026, "+name+"! May your life be filled with bright colors of happiness!";
    }
    document.getElementById("wishText").innerHTML=message;
}

// WhatsApp Share
function shareWhatsApp(){
    let text=document.getElementById("wishText").innerText;
    if(text==""){text="🎉 Happy Holi 2026!";}
    let url="https://wa.me/?text="+encodeURIComponent(text);
    window.open(url,"_blank");
}

// Color Splash Effect
setInterval(function(){
    let splash=document.createElement("div");
    splash.className="splash";
    splash.style.backgroundColor="hsl("+Math.random()*360+",100%,50%)";
    splash.style.left=Math.random()*window.innerWidth+"px";
    splash.style.top="0px";
    document.body.appendChild(splash);
    setTimeout(()=>{splash.remove();},3000);
},150);
</script>

</body>
</html>
