<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Authfy Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      height: 100vh;
    }
    .left-panel {
      background: #1f3c88;
      color: white;
      padding: 40px;
      width: 35%;
    }
    .left-panel h1 {
      font-size: 28px;
      margin-bottom: 20px;
    }
    .social-btn {
      display: block;
      margin: 10px 0;
      padding: 10px;
      text-align: center;
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
    }
    .facebook { background: #3b5998; }
    .twitter { background: #1da1f2; }
    .google { background: #db4437; }

    .right-panel {
      padding: 40px;
      width: 65%;
    
    }

    .right-panel h2 {
      margin-bottom: 10px;
      
    }

    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      box-sizing: border-box;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    button.login-btn {
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
    }

    .eye-icon {
      cursor: pointer;
      position: absolute;
      right: 10px;
      top: 45px;
    }

    .input-wrapper {
      position: relative;
    }
  </style>
</head>
<body>
  <div class="left-panel">
    <h1>Authfy</h1>
    <p>Login using social media to get quick access</p>
    <button class="social-btn facebook">Signin with Facebook</button>
    <button class="social-btn twitter">Signin with Twitter</button>
    <button class="social-btn google">Signin with Google</button>
  </div>
  <div class="right-panel">
    <h2>Login to your account</h2>
    <p>Don't have an account? <a href="#">Sign Up Free!</a></p>
    <div class="input-wrapper">
      <input type="email" id="email" placeholder="Email address">
    </div>
    <div class="input-wrapper">
      <input type="password" id="password" placeholder="Password">
      <span class="eye-icon" onclick="togglePassword()">👁</span>
    </div>
    <div class="actions">
      <label><input type="checkbox"> Remember me</label>
      <a href="#">Forgot password?</a>
    </div>
    <button class="login-btn">Login with email</button>
  </div>

  <script>
    function togglePassword() {
      const pass = document.getElementById("password");
      pass.type = pass.type === "password" ? "text" : "password";
    }
  </script>
</body>
</html>
