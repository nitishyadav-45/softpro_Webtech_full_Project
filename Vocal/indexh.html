<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocal For Local — Support Local Hands</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Fullscreen video background */
        
        .video-background {
            position: relative;
            height: 100vh;
            overflow: hidden;
        }
        
        .video-background video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(70%);
        }
        /* Overlay content */
        
        .video-content {
            position: relative;
            z-index: 1;
            color: white;
            text-align: center;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .video-content h1 {
            font-size: 3.5rem;
            font-weight: 700;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.6);
        }
        
        .video-content p {
            font-size: 1.3rem;
            margin: 15px 0;
        }
        
        .btn-explore {
            background-color: #ff9933;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            color: white;
            border-radius: 30px;
            transition: 0.3s;
        }
        
        .btn-explore:hover {
            background-color: #138808;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <!-- Background Video Section -->
    <section class="video-background">
        <!-- ✅ Replace video link below with your own Indian artisans/farmers clip -->
        <video autoplay muted loop playsinline>
      <source src="assests/images/WhatsApp Video 2025-10-12 at 13.14.11_d3f6770a.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>

        <div class="video-content container">
            <h1 style="   font-size: 3rem;
            font-weight: 700;">वोकल फॉर लोकल</h1>
            <p style="   font-size: 1.5rem;
            font-weight: 80px;">अपनी अर्थव्यवस्था को सपोर्ट करें — स्थानीय चुनें</p>
            <p style="   font-size: 1rem;
            font-weight: 50px;">🌸 “त्योहारों का इंतजार मत करें, लोकल हस्तशिल्प का समर्थन हर दिन करें।”</p>
            <button id="enterBtn" class="btn-explore">Enter A Site</button>

            <script>
                document.getElementById("enterBtn").addEventListener("click", function() {
                    window.location.href = "homeh.html";
                });
            </script>

    </section>

</body>

</html>
