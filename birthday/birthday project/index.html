<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Happy Birthday Experience 🎬</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Loader -->
    <div id="loader">
        <div class="loader-text">Preparing Surprise...</div>
    </div>

    <!-- Confetti Canvas -->
    <canvas id="confettiCanvas"></canvas>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg glass-nav fixed-top">
        <div class="container">
            <a class="navbar-brand">🎂 Birthday</a>

            <div>
                <a href="gallery.html" class="nav-link-custom">Gallery</a>
                <a href="wishes.html" class="nav-link-custom">Wishes</a>
                <a href="surprise.html" class="nav-link-custom">Surprise</a>
                <button onclick="toggleTheme()" class="theme-btn">🌙</button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section text-center">
        <h1 class="cinematic-title">Happy Birthday 🎉</h1>
        <p class="subtitle">An Unforgettable Digital Surprise 💖</p>

        <div id="countdown" class="countdown-box"></div>

        <a href="surprise.html" class="enter-btn">
            Enter Celebration 🎁
        </a>
    </section>

    <audio id="bgMusic" loop>
        <source src="music/birthday.mp3" type="audio/mpeg">
    </audio>

    <script src="js/script.js"></script>
</body>

</html>
