<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Gallery 🎂</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<style>
.gallery-section {
padding: 120px 0;
}

.gallery-card {
overflow: hidden;
border-radius: 20px;
position: relative;
transition: 0.5s;
}

.gallery-card img {
width: 100%;
height: 300px;
object-fit: cover;
transition: 0.6s;
}

.gallery-card:hover img {
transform: scale(1.2);
filter: brightness(0.7);
}

.gallery-card::after {
content: "Beautiful Memory 💖";
position: absolute;
bottom: 20px;
left: 20px;
color: white;
font-weight: bold;
opacity: 0;
transition: 0.4s;
}

.gallery-card:hover::after {
opacity: 1;
}
</style>
</head>

<body>

<section class="gallery-section container text-center">
<h1 class="cinematic-title mb-5">Memories Gallery 📸</h1>

<div class="row g-4">

<div class="col-md-4">
<div class="gallery-card">
<img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e">
</div>
</div>

<div class="col-md-4">
<div class="gallery-card">
<img src="https://images.unsplash.com/photo-1511988617509-a57c8a288659">
</div>
</div>

<div class="col-md-4">
<div class="gallery-card">
<img src="https://images.unsplash.com/photo-1504196606672-aef5c9cefc92">
</div>
</div>

</div>

<div class="mt-5">
<a href="index.html" class="enter-btn">Back Home</a>
</div>

</section>

<script src="js/script.js"></script>
</body>
</html>
