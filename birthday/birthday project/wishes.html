<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Wishes 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<style>
.wish-section {
padding: 120px 0;
}

.wish-card {
background: rgba(255,255,255,0.2);
backdrop-filter: blur(10px);
border-radius: 20px;
padding: 40px;
color: white;
transition: 0.5s;
}

.wish-card:hover {
transform: translateY(-15px) scale(1.05);
box-shadow: 0 0 40px gold;
}
</style>
</head>

<body>

<section class="wish-section container text-center">

<h1 class="cinematic-title mb-5">Special Wishes 💌</h1>

<div class="row g-4">

<div class="col-md-4">
<div class="wish-card">
<h4>May your smile shine forever ✨</h4>
</div>
</div>

<div class="col-md-4">
<div class="wish-card">
<h4>Wishing you endless happiness 🎉</h4>
</div>
</div>

<div class="col-md-4">
<div class="wish-card">
<h4>May all dreams come true 💖</h4>
</div>
</div>

</div>

<div class="mt-5">
<a href="index.html" class="enter-btn">Back Home</a>
</div>

</section>

<script src="js/script.js"></script>
</body>
</html>
