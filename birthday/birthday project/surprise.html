<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Surprise 🎁</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<style>
.surprise-section {
padding: 120px 0;
text-align: center;
color: white;
}

.gift-box {
width: 200px;
cursor: pointer;
transition: 0.5s;
}

.gift-box:hover {
transform: rotate(10deg) scale(1.1);
}

.cake {
display: none;
width: 250px;
margin-top: 30px;
animation: popUp 1s ease forwards;
}

@keyframes popUp {
from { transform: scale(0); }
to { transform: scale(1); }
}
</style>
</head>

<body>

<section class="surprise-section container">

<h1 class="cinematic-title">Open Your Surprise 🎁</h1>

<img src="https://cdn-icons-png.flaticon.com/512/3468/3468375.png"
class="gift-box"
onclick="openGift()">

<img src="https://images.unsplash.com/photo-1542826438-bd32f43d626f"
class="cake"
id="cakeImage">

<h2 id="surpriseMessage" class="mt-4"></h2>

<div class="mt-5">
<a href="index.html" class="enter-btn">Back Home</a>
</div>

</section>

<script>
function openGift(){
document.getElementById("cakeImage").style.display="block";
document.getElementById("surpriseMessage").innerHTML="🎉 Happy Birthday! Celebrate Big! 🎂";
}
</script>

<script src="js/script.js"></script>
</body>
</html>
