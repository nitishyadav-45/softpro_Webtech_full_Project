<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Collection Slider</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #1e252b;
      color: white;
      font-family: 'Poppins', sans-serif;
    }

    .book-section-heading {
      text-align: center;
      font-size: 2.8rem;
      font-weight: 700;
      margin: 50px 0 30px;
    }

    .book-slider-item {
      padding: 20px 0;
    }

    .book-card {
      background-color: #2b3138;
      border: none;
      border-radius: 15px;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .book-card:hover {
      transform: scale(1.05);
    }

    .book-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .book-card:hover img {
      transform: scale(1.1);
    }

    .book-card-body {
      text-align: center;
      padding: 20px;
    }

    .book-title {
      font-size: 1.3rem;
      font-weight: 600;
    }

    .book-author {
      font-size: 0.95rem;
      color: #ccc;
    }

    .book-prev-icon,
    .book-next-icon {
      background-color: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      padding: 15px;
    }

    .book-prev-btn,
    .book-next-btn {
      width: 5%;
    }
  </style>
</head>
<body>

  <h2 class="book-section-heading">Our Diverse Collection</h2>

  <div id="bookSlider" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
    <div class="carousel-inner container">

      <!-- Slide 1 -->
      <div class="carousel-item active book-slider-item">
        <div class="row justify-content-center">
          <div class="col-md-4">
            <div class="book-card">
              <img src="https://images.pexels.com/photos/256455/pexels-photo-256455.jpeg" alt="">
              <div class="book-card-body">
                <h5 class="book-title">Epic Fantasy</h5>
                <p class="book-author">J.R.R. Tolkien</p>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="book-card">
              <img src="https://images.pexels.com/photos/415071/pexels-photo-415071.jpeg" alt="">
              <div class="book-card-body">
                <h5 class="book-title">Sci-Fi Adventures</h5>
                <p class="book-author">Isaac Asimov</p>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="book-card">
              <img src="https://images.pexels.com/photos/2177482/pexels-photo-2177482.jpeg" alt="">
              <div class="book-card-body">
                <h5 class="book-title">World History</h5>
                <p class="book-author">Yuval Noah Harari</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Slide 2 -->
      <div class="carousel-item book-slider-item">
        <div class="row justify-content-center">
          <div class="col-md-4">
            <div class="book-card">
              <img src="https://images.pexels.com/photos/590493/pexels-photo-590493.jpeg" alt="">
              <div class="book-card-body">
                <h5 class="book-title">Mystery Tales</h5>
                <p class="book-author">Agatha Christie</p>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="book-card">
              <img src="https://images.pexels.com/photos/256546/pexels-photo-256546.jpeg" alt="">
              <div class="book-card-body">
                <h5 class="book-title">Romantic Stories</h5>
                <p class="book-author">Jane Austen</p>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="book-card">
              <img src="https://images.pexels.com/photos/1112048/pexels-photo-1112048.jpeg" alt="">
              <div class="book-card-body">
                <h5 class="book-title">Modern Fiction</h5>
                <p class="book-author">George Orwell</p>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Controls -->
    <button class="carousel-control-prev book-prev-btn" type="button" data-bs-target="#bookSlider" data-bs-slide="prev">
      <span class="carousel-control-prev-icon book-prev-icon"></span>
    </button>
    <button class="carousel-control-next book-next-btn" type="button" data-bs-target="#bookSlider" data-bs-slide="next">
      <span class="carousel-control-next-icon book-next-icon"></span>
    </button>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
