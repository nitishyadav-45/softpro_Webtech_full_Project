<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Speech</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-cover bg-center"
    style="background-image: url('https://images.unsplash.com/photo-1508780709619-79562169bc64?auto=format&fit=crop&w=1470&q=80');">

    <div class="bg-white bg-opacity-90 rounded-3xl shadow-xl p-10 max-w-md w-full text-center relative">

        <!-- Logo -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/ab/Logo_TV_2015.png" alt="Logo"
            class="mx-auto w-20 mb-6">

        <!-- Page Title -->
        <h1 class="text-3xl font-bold text-purple-700 mb-6">Text to Speech 🔊</h1>

        <!-- Input Field -->
        <textarea id="text" placeholder="Type something..." rows="5"
            class="w-full border-2 border-purple-300 rounded-xl px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-purple-400 mb-6 resize-none">
</textarea>

        <!-- Speak Button -->
        <button onclick="speakText()"
            class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-xl transition duration-300 flex items-center justify-center mx-auto">
            🔊 Speak
        </button>
    </div>

    <script>
        function speakText() {
            const text = document.getElementById('text').value;
            if (text.trim() !== "") {
                speechSynthesis.speak(new SpeechSynthesisUtterance(text));
            } else {
                alert("Please type something to speak!");
            }
        }
    </script>

</body>

</html>
