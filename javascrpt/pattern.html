<html>
<head>
<script>
//pattern validation
function as(){
var pname=/^[A-Za-z]{3,7}$/;
//alert("hii hii");
var name=document.getElementById("tb").value;
//alert(name);
if(!pname.test(name)){

//alert("invalid");
document.getElementById("sp").innerHTML="invalid name"
document.getElementById("tb").style.border="2px solid red";

}
else{
//alert("valid");
document.getElementById("sp").innerHTML="valid name"
document.getElementById("tb").style.border="2px solid green";
}

}


</script>
</head>
<body>
Enter a no.
<input type="text" id="tb">


<br>
<input type="button" value="check" onclick="as()"/>
<span id="sp"></span>
</body>
</html>
