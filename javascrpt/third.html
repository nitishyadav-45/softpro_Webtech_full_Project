<html>
<head>
<script>
//WAP to add no (user's input)
 function add()
 {
 //window.alert("hii hii");
 var a=document.getElementById("f").value;
 //alert(a);
 var b=document.getElementById("s").value;
 //alert(b);
var c=parseInt(a)+parseInt(b) ;
//window.alert("Sum = "+c)
//document.write("Sum = "+c)
//document.getElementById("h1").innerHTML=c;
document.getElementById("res").value=c;
 }
 //WAP to SUB no (user's input)
 function sub()
 {
 //window.alert("hii hii")
 var a=document.getElementById("f").value;
 //alert(a);
 var b=document.getElementById("s").value;
 //alert(b)
 var c=a-b;
 document.getElementById("res").value=c;
 }
 // WAP to multiple no.(user's input)
 function multiply()
 {
 var a=document.getElementById("f").value;
 var b=document.getElementById("s").value;
  var c=a*b;
  document.getElementById("res").value=c;
  
 }
 // WAP to divide no.(user's input)
  function divide()
 {
 var a=document.getElementById("f").value;
 var b=document.getElementById("s").value;
  var c=a/b;
  document.getElementById("res").value=c;
 }
 // WAP to module no.(user's input)
 function module()
 {
 var a=document.getElementById("f").value;
 var b=document.getElementById("s").value;
  var c=a%b;
  document.getElementById("res").value=c;
 }
 function pra()
 { 
 var a=document.getElementById("f").value;
 var b=document.getElementById("s").value;
  var c=a*b/100;
  document.getElementById("res").value=c;
 }
 
</script>
</head>
<body>
Enter first no
<input type="text" id="f"/>
<br/>
Enter Scecond no
<input type="text" id="s"/>
<br/>
<input type="button" value="Add" onclick="add()"/>
<input type="button" value="Sub" onclick="sub()"/>
<input type="button" value="multiply" onclick="multiply()"/>
<input type="button" value="Division" onclick="divide()"/>
<input type="button" value="module" onclick="module()"/>
<input type="button" value="Precentage" onclick="pra()"/>
<input type="text" id="res" readonly="true"/>
</body>
</html>
